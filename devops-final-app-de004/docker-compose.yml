version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db-net

  app:
    # TODO 1: build từ thư mục gốc (.), truyền build-arg APP_VERSION
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    # TODO 2: Tên image <APP_IMAGE>:<APP_TAG>, mặc định devops-final-app:latest
    image: ${APP_IMAGE:-devops-final-app}:${APP_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: always
    # TODO 3: DB_NAME, DB_USER, DB_PASSWORD lấy từ biến MySQL trong student.env, không ghi cứng
    environment:
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - db-net
      - proxy-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: always
    # TODO 4: public cổng cá nhân APP_PORT ra cổng 80 của container
    ports:
      - "${APP_PORT}:80"
    # TODO 5: Mount read-only: nginx/default.conf -> /etc/nginx/conf.d/default.conf
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  mysql_data: